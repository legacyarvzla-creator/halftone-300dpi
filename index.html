<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Semitonos 300 DPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Conversor de Semitonos (300 DPI)</h1>
    
    <div class="controls">
      <!-- Seleccionar Imagen -->
      <div class="control-group">
        <label for="imageInput">Seleccionar Imagen:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <!-- Modo de Color -->
      <div class="control-group">
        <label for="colorModeSelect">Modo de Color:</label>
        <select id="colorModeSelect">
          <option value="color">A Color (Mantiene colores originales)</option>
          <option value="monochrome">Monocromático / Tinta Única</option>
        </select>
      </div>

      <!-- Método de Tramado -->
      <div class="control-group">
        <label for="methodSelect">Método de Tramado:</label>
        <select id="methodSelect">
          <option value="halftone">Semitono (Patrón de puntos clásico)</option>
          <option value="diffusion">Difusión (Textura tipo grano / Floyd-Steinberg)</option>
        </select>
      </div>

      <!-- Frecuencia de Pantalla (LPI) (5 a 100) -->
      <div class="control-group">
        <label for="screenLpi">Frecuencia de Pantalla (LPI): <span id="lpiVal">35</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenLpi" min="5" max="100" value="35" style="flex: 1;">
          <button type="button" onclick="resetInput('screenLpi', 35)" style="padding: 2px 6px; cursor: pointer;">↺</button>
        </div>
      </div>

      <!-- Ángulo de Pantalla (0 a 90 con decimales permitidos) -->
      <div class="control-group">
        <label for="screenAngle">Ángulo de Pantalla (°): <span id="angleVal">22.5</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenAngle" min="0" max="90" step="0.5" value="22.5" style="flex: 1;">
          <button type="button" onclick="resetInput('screenAngle', 22.5)" style="padding: 2px 6px; cursor: pointer;">↺</button>
        </div>
      </div>

      <!-- Forma del Punto -->
      <div class="control-group">
        <label for="dotShape">Forma del Punto:</label>
        <select id="dotShape">
          <option value="round">Redondo (Circular)</option>
          <option value="line">Línea (Estilo grabado)</option>
        </select>
      </div>

      <!-- Modo de Salida: Invertir para prenda oscura -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #eee; padding-top: 10px; margin-top: 5px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="invertToggle"> 
          <strong>Invertir para prenda oscura (Invert for Dark Garment)</strong>
        </label>
        <small style="color: #666; margin-top: 2px; display: block;">Invierte los tonos para imprimir con tinta clara sobre fondo oscuro.</small>
      </div>

      <!-- Recorte Automático de Fondo Negro -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #eee; padding-top: 10px; margin-top: 5px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="cropBgToggle"> 
          <strong>Recortar fondo negro automáticamente</strong>
        </label>
      </div>

      <!-- Umbral de Recorte (0 a 255) -->
      <div class="control-group" id="cropThresholdGroup" style="opacity: 0.5; pointer-events: none;">
        <label for="cropThreshold">Umbral de Recorte (0 - 255): <span id="cropThresholdValue">20</span></label>
        <input type="range" id="cropThreshold" min="0" max="255" value="20">
      </div>

      <!-- Curva de Tono / Niveles -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #eee; padding-top: 15px; margin-top: 5px;">
        <strong style="margin-bottom: 8px; display: block; color: #2c3e50;">Curva de Tono (Niveles)</strong>
      </div>

      <!-- Punto Negro (0 a 255) -->
      <div class="control-group">
        <label for="blackPoint">Punto Negro (0 - 255): <span id="blackPointVal">0</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="blackPoint" min="0" max="255" value="0" style="flex: 1;">
          <button type="button" onclick="resetInput('blackPoint', 0)" style="padding: 2px 6px; cursor: pointer;">↺</button>
        </div>
      </div>

      <!-- Punto Blanco (0 a 255) -->
      <div class="control-group">
        <label for="whitePoint">Punto Blanco (0 - 255): <span id="whitePointVal">255</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="whitePoint" min="0" max="255" value="255" style="flex: 1;">
          <button type="button" onclick="resetInput('whitePoint', 255)" style="padding: 2px 6px; cursor: pointer;">↺</button>
        </div>
      </div>

      <!-- Gamma (0.1 a 3) -->
      <div class="control-group">
        <label for="gammaInput">Gamma (0.1 - 3.0): <span id="gammaVal">1.00</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="gammaInput" min="0.1" max="3.0" step="0.05" value="1.0" style="flex: 1;">
          <button type="button" onclick="resetInput('gammaInput', 1.0)" style="padding: 2px 6px; cursor: pointer;">↺</button>
        </div>
      </div>
    </div>

    <button id="downloadBtn" class="btn" disabled>Descargar Imagen (300 DPI)</button>

    <div class="preview-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
