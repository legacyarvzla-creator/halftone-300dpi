<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semitonos Legacy - Conversor 300 DPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Logo y Título Legacy -->
    <div class="brand-header">
      <img src="LEGACY%20AR.png" alt="Legacy Logo" class="logo-img">
      <h1>SEMITONOS LEGACY</h1>
      <p class="subtitle">Conversor profesional de semitonos y difusión a 300 DPI para DTF y Serigrafía</p>
    </div>
    
    <div class="controls">
      <!-- Seleccionar Imagen -->
      <div class="control-group">
        <label for="imageInput">Seleccionar Imagen:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <!-- Modo de Color -->
      <div class="control-group">
        <label for="colorModeSelect">Modo de Color:</label>
        <select id="colorModeSelect">
          <option value="color">A Color (Mantiene colores originales)</option>
          <option value="monochrome">Monocromático / Tinta Única</option>
        </select>
      </div>

      <!-- Método de Tramado -->
      <div class="control-group">
        <label for="methodSelect">Método de Tramado:</label>
        <select id="methodSelect">
          <option value="halftone">Semitono (Patrón de puntos clásico)</option>
          <option value="diffusion">Difusión (Textura tipo grano / Floyd-Steinberg)</option>
        </select>
      </div>

      <!-- Frecuencia de Pantalla (LPI) -->
      <div class="control-group">
        <label for="screenLpi">Frecuencia de Pantalla (LPI): <span id="lpiVal">30</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenLpi" min="5" max="100" value="30" style="flex: 1;">
          <button type="button" onclick="resetInput('screenLpi', 30)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Ángulo de Pantalla -->
      <div class="control-group">
        <label for="screenAngle">Ángulo de Pantalla (°): <span id="angleVal">22.5</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenAngle" min="0" max="90" step="0.5" value="22.5" style="flex: 1;">
          <button type="button" onclick="resetInput('screenAngle', 22.5)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Forma del Punto -->
      <div class="control-group">
        <label for="dotShape">Forma del Punto:</label>
        <select id="dotShape">
          <option value="round">Redondo (Circular)</option>
          <option value="line">Línea (Estilo grabado)</option>
        </select>
      </div>

      <!-- Selector de Canales / Colores a Tramar -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 15px; margin-top: 5px;">
        <strong style="margin-bottom: 8px; display: block; color: #cfd9df;">Aislar / Filtrar Canales de Color</strong>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="colorFilterGroup">
          <button type="button" class="color-filter-btn active" data-color="all">Todos</button>
          <button type="button" class="color-filter-btn" data-color="red">Rojo</button>
          <button type="button" class="color-filter-btn" data-color="green">Verde</button>
          <button type="button" class="color-filter-btn" data-color="blue">Azul</button>
          <button type="button" class="color-filter-btn" data-color="yellow">Amarillo</button>
          <button type="button" class="color-filter-btn" data-color="pink">Rosa</button>
          <button type="button" class="color-filter-btn" data-color="white">Blanco</button>
        </div>
      </div>

      <!-- Modo de Salida: Invertir para prenda oscura -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e0e0e0;">
          <input type="checkbox" id="invertToggle"> 
          <strong>Invertir para prenda oscura (Invert for Dark Garment)</strong>
        </label>
        <small style="color: #888; margin-top: 2px; display: block;">Invierte los tonos para imprimir con tinta clara sobre fondo oscuro.</small>
      </div>

      <!-- Recorte Automático de Fondo Negro -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e0e0e0;">
          <input type="checkbox" id="cropBgToggle"> 
          <strong>Recortar fondo negro automáticamente</strong>
        </label>
      </div>

      <!-- Umbral de Recorte -->
      <div class="control-group" id="cropThresholdGroup" style="opacity: 0.5; pointer-events: none;">
        <label for="cropThreshold">Umbral de Recorte (0 - 255): <span id="cropThresholdValue">20</span></label>
        <input type="range" id="cropThreshold" min="0" max="255" value="20">
      </div>

      <!-- Curva de Tono / Niveles -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 15px; margin-top: 5px;">
        <strong style="margin-bottom: 8px; display: block; color: #cfd9df;">Curva de Tono (Niveles)</strong>
      </div>

      <!-- Punto Negro -->
      <div class="control-group">
        <label for="blackPoint">Punto Negro (0 - 255): <span id="blackPointVal">0</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="blackPoint" min="0" max="255" value="0" style="flex: 1;">
          <button type="button" onclick="resetInput('blackPoint', 0)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Punto Blanco -->
      <div class="control-group">
        <label for="whitePoint">Punto Blanco (0 - 255): <span id="whitePointVal">255</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="whitePoint" min="0" max="255" value="255" style="flex: 1;">
          <button type="button" onclick="resetInput('whitePoint', 255)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Gamma -->
      <div class="control-group">
        <label for="gammaInput">Gamma (0.1 - 3.0): <span id="gammaVal">1.00</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="gammaInput" min="0.1" max="3.0" step="0.05" value="1.0" style="flex: 1;">
          <button type="button" onclick="resetInput('gammaInput', 1.0)" class="reset-btn">↺</button>
        </div>
      </div>
    </div>

    <button id="downloadBtn" class="btn" disabled>Descargar Imagen (300 DPI)</button>

    <div class="preview-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
