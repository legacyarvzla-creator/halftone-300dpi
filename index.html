<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semitonos LEGACY AR - Conversor 300 DPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <img src="LEGACY%20AR.png" alt="Legacy Logo" class="logo-img">
      <h1>SEMITONOS LEGACY</h1>
      <p class="subtitle">Conversor profesional de semitonos y patrones a 300 DPI (Fondo Transparente PNG)</p>
    </div>
    
    <div class="controls">
      <!-- Cargar Imagen -->
      <div class="control-group" style="grid-column: 1 / -1; background: #1f2833; padding: 12px; border-radius: 8px; border: 1px solid #45a29e;">
        <label for="imageInput" style="font-weight: bold; color: #66fcf1; margin-bottom: 5px; display: block;">📂 Seleccionar Imagen:</label>
        <input type="file" id="imageInput" accept="image/*" style="width: 100%; color: #fff;">
      </div>

      <select id="methodSelect">
  <option value="diffusion_original">1. Difusión / Grano Real (Original - Tu Favorito)</option>
  <option value="diffusion_variable">2. Difusión / Grano Ajustable (Por LPI)</option>
  <option value="standard">3. Rejilla Cuadrada (Estándar a Color)</option>
  <option value="hexagonal">4. Tramado Hexagonal (Panal a Color)</option>
  <option value="lines">5. Líneas de Grabado (Efecto Billete a Color)</option>
  <option value="concentric">6. Anillos Concéntricos (Ondas a Color)</option>
  <option value="stochastic_fade">7. Difuminado Orgánico (DTF sin malla)</option>
  <option value="hybrid_legacy" selected>8. Híbrido Legacy (Sólidos Limpios + Difusión Suave)</option>
</select>

      <!-- Frecuencia / Tamaño de Trama (LPI) -->
      <div class="control-group">
        <label for="screenLpi">Densidad / LPI (Tamaño de Grano / Punto): <span id="lpiVal">30</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenLpi" min="5" max="100" value="30" style="flex: 1;">
          <button type="button" onclick="resetInput('screenLpi', 30)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Ángulo de Pantalla -->
      <div class="control-group">
        <label for="screenAngle">Ángulo (°): <span id="angleVal">22.5</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="screenAngle" min="0" max="90" step="0.5" value="22.5" style="flex: 1;">
          <button type="button" onclick="resetInput('screenAngle', 22.5)" class="reset-btn">↺</button>
        </div>
      </div>

      <!-- Forma del Punto -->
      <div class="control-group">
        <label for="dotShape">Forma del Punto:</label>
        <select id="dotShape">
          <option value="round">Redondo (Circular)</option>
          <option value="line">Línea (Estilo grabado)</option>
        </select>
      </div>

      <!-- Recorte Automático -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e0e0e0;">
          <input type="checkbox" id="cropBgToggle"> 
          <strong>Recortar fondo negro automáticamente</strong>
        </label>
      </div>

      <div class="control-group" id="cropThresholdGroup" style="opacity: 0.5; pointer-events: none;">
        <label for="cropThreshold">Umbral de Recorte: <span id="cropThresholdValue">20</span></label>
        <input type="range" id="cropThreshold" min="0" max="255" value="20">
      </div>

      <!-- Curva de Tono / Niveles -->
      <div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 15px; margin-top: 5px;">
        <strong style="margin-bottom: 8px; display: block; color: #cfd9df;">Curva de Tono (Niveles)</strong>
      </div>

      <div class="control-group">
        <label for="blackPoint">Punto Negro: <span id="blackPointVal">0</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="blackPoint" min="0" max="255" value="0" style="flex: 1;">
          <button type="button" onclick="resetInput('blackPoint', 0)" class="reset-btn">↺</button>
        </div>
      </div>

      <div class="control-group">
        <label for="whitePoint">Punto Blanco: <span id="whitePointVal">255</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="whitePoint" min="0" max="255" value="255" style="flex: 1;">
          <button type="button" onclick="resetInput('whitePoint', 255)" class="reset-btn">↺</button>
        </div>
      </div>

      <div class="control-group">
        <label for="gammaInput">Gamma: <span id="gammaVal">1.00</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="range" id="gammaInput" min="0.1" max="3.0" step="0.05" value="1.0" style="flex: 1;">
          <button type="button" onclick="resetInput('gammaInput', 1.0)" class="reset-btn">↺</button>
        </div>
      </div>
    </div>

    <!-- Controles de Zoom -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0 5px 0; background: #1f2833; padding: 10px; border-radius: 6px;">
      <span style="color: #66fcf1; font-weight: bold; font-size: 14px;">🔍 Zoom de Vista Previa: <span id="zoomVal">100%</span></span>
      <div style="display: flex; gap: 8px;">
        <button type="button" id="zoomOutBtn" style="padding: 5px 12px; background: #0b0c10; color: #fff; border: 1px solid #45a29e; border-radius: 4px; cursor: pointer;">Alejar (-)</button>
        <button type="button" id="zoomResetBtn" style="padding: 5px 12px; background: #0b0c10; color: #fff; border: 1px solid #45a29e; border-radius: 4px; cursor: pointer;">1:1</button>
        <button type="button" id="zoomInBtn" style="padding: 5px 12px; background: #0b0c10; color: #fff; border: 1px solid #45a29e; border-radius: 4px; cursor: pointer;">Acercar (+)</button>
      </div>
    </div>

    <button id="downloadBtn" class="btn" disabled>Descargar Imagen (300 DPI - Transparente)</button>

    <!-- Vista Previa con fondo ajedrezado para transparente -->
    <div class="preview-area" style="width: 100%; height: 500px; overflow: auto; background: #111; background-image: linear-gradient(45deg, #181818 25%, transparent 25%), linear-gradient(-45deg, #181818 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #181818 75%), linear-gradient(-45deg, transparent 75%, #181818 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; border: 2px dashed #45a29e; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center;">
      <canvas id="canvas" style="transform-origin: center center; display: block;"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
