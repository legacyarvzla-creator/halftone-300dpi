<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Semitonos 300 DPI</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      text-align: center;
      color: #2c3e50;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input[type="file"], input[type="range"], select {
      margin-top: 5px;
    }
    .btn {
      background-color: #0066ff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #0052cc;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .preview-area {
      margin-top: 20px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #fff;
    }
  </style>
</head>

  <div class="container">
    <h1>Conversor de Semitonos (300 DPI)</h1>
    
    <div class="controls">
      <div class="control-group">
        <label for="imageInput">Seleccionar Imagen:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="dotSize">Tamaño del punto (<span id="dotValue">8</span>px):</label>
        <input type="range" id="dotSize" min="3" max="30" value="8">
      </div>

      <div class="control-group">
        <label for="dotShape">Forma del punto:</label>
        <select id="dotShape">
          <option value="circle">Círculo</option>
          <option value="square">Cuadrado</option>
        </select>
      </div>
    </div>

    <button id="downloadBtn" class="btn" disabled>Descargar Imagen (300 DPI)</button>

    <div class="preview-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>
