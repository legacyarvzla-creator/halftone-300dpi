<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Semitonos 300 DPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Conversor de Semitonos (300 DPI)</h1>
    
    <div class="controls">
      <div class="control-group">
        <label for="imageInput">Seleccionar Imagen:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="dotSize">Tamaño del punto (<span id="dotValue">8</span>px):</label>
        <input type="range" id="dotSize" min="3" max="30" value="8">
      </div>

      <div class="control-group">
        <label for="dotShape">Forma del punto:</label>
        <select id="dotShape">
          <option value="circle">Círculo</option>
          <option value="square">Cuadrado</option>
        </select>
      </div>
    </div>
    <!-- Opción de Recorte Automático de Fondo Negro -->
<div class="control-group" style="grid-column: 1 / -1; border-top: 1px solid #eee; padding-top: 10px; margin-top: 5px;">
  <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
    <input type="checkbox" id="cropBgToggle"> 
    <strong>Recortar fondo negro automáticamente</strong>
  </label>
</div>

<div class="control-group" id="cropThresholdGroup" style="opacity: 0.5; pointer-events: none;">
  <label for="cropThreshold">Umbral de recorte (0 - 255): <span id="cropThresholdValue">20</span></label>
  <input type="range" id="cropThreshold" min="0" max="255" value="20">
</div>

    <button id="downloadBtn" class="btn" disabled>Descargar Imagen (300 DPI)</button>

    <div class="preview-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
